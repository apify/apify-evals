# The Notion MCP server under test, with or without agent skills for Notion.
#
# Default server: the open-source `@notionhq/notion-mcp-server` over stdio
# (installed in the runner image), authenticated with the "Notion shared token"
# integration secret as NOTION_TOKEN. Notion's hosted server (mcp.notion.com)
# is OAuth-only; to evaluate against it instead, swap `mcp` for
#
#   mcp:
#       name: notion
#       transport: http
#       url: https://mcp.notion.com/mcp
#       headers: { Authorization: 'Bearer ${NOTION_MCP_TOKEN}' }
#
# with an OAuth access token in NOTION_MCP_TOKEN. The hosted server is what the
# `apify-notion` skill and Notion's own skills were written for (notion-search,
# notion-fetch); the open-source server exposes API-post-search and friends.
# Scenario checks accept both names, so the same suite runs on either.
#
# Skill variants: `skillSets: ["none", "apify-notion", ...]` or
# `skillCombinations: true` for one experiment per subset of agentSkills.
name: notion-mcp
subjectKind: mcp-tool
description: Notion MCP tools driven by an agent (find, verify, cite in Apify's workspace), with and without agent skills.
mcp:
    name: notion
    transport: stdio
    command: notion-mcp-server
    args: [--transport, stdio]
    env:
        NOTION_TOKEN: ${NOTION_TOKEN}
agentSkills:
    - apify-notion
    - notion-knowledge-capture
    - notion-meeting-intelligence
    - notion-research-documentation
    - notion-spec-to-implementation
skills:
    find:
        label: Selected
        description: The task is described in user terms; the agent must pick the right tools and workflow among all Notion tools.
        tools: ['*']
        maxTurns: 14
    use:
        label: Used
        description: The tool is named in the prompt; the agent must call it correctly and use its result.
        tools: ['*']
        maxTurns: 12
wrongSubjectLabel: wrong-tool
fixAreas:
    - id: tool-description
      owner: subject
      description: The tool's description misled the agent about when to use it.
    - id: tool-schema
      owner: subject
      description: The agent built invalid or wrong arguments given the tool's input schema (Notion API payloads).
    - id: tool-result-shape
      owner: subject
      description: The agent could not use what the tool returned (nested Notion objects, pagination).
    - id: error-messages
      owner: subject
      description: The tool errored in a way the agent could not recover from.
    - id: tool-selection
      owner: server
      description: Too many or overlapping tools made the agent pick the wrong one or a slower path.
    - id: skill-instructions
      owner: skills
      description: An injected skill's instructions sent the agent down the wrong path (wrong tool names, a workflow that does not fit the task).
    - id: agent-or-model
      owner: none
      description: The tools did their part; the failure is the agent's reasoning or the model.
forcedFixAreas:
    subject.used: { find: tool-selection, use: tool-description }
    tool.called: tool-selection
evidence: [tool-calls]

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-evals:
    # The live Langfuse-based evals: contract, runner, judge, tools, scenarios.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the pinned OpenCode CLI for the runner's real-CLI tests
        # The version the runner image pins (actors/workflow-runner/Dockerfile), into a
        # temp prefix, not globally. The launcher's postinstall is skipped and the
        # baseline glibc build linked by hand, so the install is the same on every runner.
        run: |
          set -eu
          prefix="$RUNNER_TEMP/opencode"
          npm install --prefix "$prefix" --no-save --omit=optional --ignore-scripts --audit=false --fund=false \
            @opencode/cli@2.2.6 @opencode/cli-linux-x64-baseline@2.2.6
          ln -f "$prefix/node_modules/@opencode/cli-linux-x64-baseline/bin/opencode" \
            "$prefix/node_modules/@opencode/cli/bin/opencode.exe"
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          "$prefix/node_modules/.bin/opencode" --version
          echo "REQUIRE_REAL_OPENCODE=1" >> "$GITHUB_ENV"
      - name: Build and test the eval workspaces
        # npm silently no-ops a `-w` flag that does not resolve, so an explicit
        # list would pass while exercising nothing. Select what is checked out.
        run: |
          set -eu
          workspaces=""
          for w in contract report actors/judge actors/workflow-runner tools; do
            if [ -f "$w/package.json" ]; then workspaces="$workspaces -w $w"; fi
          done
          echo "Workspaces:$workspaces"
          npm run build $workspaces --if-present
          npm test $workspaces --if-present
      - name: Validate scenario files against the contract
        run: npm run scenarios:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cd shared && npm run build
      - run: cd actors/runner && npm run build
      # Live claude-agent integration tests skip here (binary not installed) —
      # they run for real in the integration-tests job below.
      - run: cd shared && npx vitest run

  integration-tests:
    runs-on: ubuntu-latest
    # Skip on fork PRs, where repository secrets (the OAuth token) aren't available.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # Long-lived Claude subscription OAuth token (generate with `claude setup-token`).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cd shared && npm run build
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Verify claude is on PATH
        run: claude --version
      # Live, billable tests — run only when the OAuth token secret is configured.
      # Without it, the step is skipped (job stays green) rather than failing on auth.
      - name: Run live integration tests
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: cd shared && npx vitest run integration

# The Apify CLI tools in Bash: the Apify CLI (logged in with APIFY_TOKEN) and
# mcpc, the MCP CLI client, already connected to the Apify MCP server as the
# session @apify. The agent has no MCP tools of its own. The agent
# is not blocked from other surfaces (it can still curl the API); the evidence
# records what it used (surfacesUsed, check surface.used).
#
# Test another build without editing this file: the runner inputs
# `cliVersion` and `mcpcVersion` (e.g. "beta") override `cli.version` and
# `mcpc.version` for every surface in the run.
name: cli
kind: cli
description: Apify CLI and mcpc (connected to the Apify MCP server) in Bash. No MCP tools of the agent's own.
mcp: false
bash: true
cli:
    package: apify-cli
    version: 1.10.0
mcpc:
    package: '@apify/mcpc'
    version: 0.7.0
env:
    APIFY_TOKEN: ${APIFY_TOKEN}
promptSuffix: >-
    The Apify CLI (`apify`) is installed and logged in. `mcpc`, a command-line MCP client, is installed and connected
    to the Apify MCP server as the session @apify (see `mcpc @apify tools-list`).
